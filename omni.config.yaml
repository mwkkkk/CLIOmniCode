llm:
  provider: qwen

models:
  conductor: qwen-plus
  coder: qwen3-coder-plus
  explorer: qwen-flash
  planner: qwen-plus
  reviewer: qwen-plus
  verifier: qwen-flash
  reflection: qwen-flash

agents:
  conductor:
    tools: [read, grep, glob, dispatch, ask_user]
    readonly: false
    max_turns: 30
  planner:
    tools: [read, grep, glob]
    readonly: true
    max_turns: 15
  explorer:
    tools: [read, grep, glob]
    readonly: true
    max_turns: 15
  coder:
    tools: [read, write, edit, bash, grep, glob]
    readonly: false
    max_turns: 25
  reviewer:
    tools: [read, grep, glob]
    readonly: true
    max_turns: 15
  verifier:
    tools: [read, bash]
    readonly: false
    max_turns: 10

memory:
  reflection_confidence_threshold: 0.7
  semantic_recall_top_k: 5
  procedural_recall_top_k: 3
  episodic_recall_top_k: 3
  entity_recall_top_k: 10
  smart_recall: true
  recall_max_total: 5
  consolidation:
    auto: true
    min_pending_semantic: 3
    min_pending_procedural: 2
    min_episodes_since_last: 5
    procedural_min_steps: 3
    procedural_confidence: 0.85
    semantic_confidence: 0.75

session:
  data_dir: ~/.omni
